name: Test basic usage - get CodeQL languages
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        with:
          access-token: ${{ github.token }}
          endpoint: https://api.github.com/repos/github/linguist/languages
          exclude: ''

      - name: Assert languages output is a non-empty JSON array
        env:
          ACTUAL: ${{ steps.action.outputs.languages }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: languages output is empty"
            exit 1
          fi
          # Verify it's a valid JSON array
          echo "$ACTUAL" | python3 -c "import sys, json; data = json.load(sys.stdin); assert isinstance(data, list), 'Not a list'" || {
            echo "FAIL: output is not a valid JSON array"
            exit 1
          }
          # Verify it contains at least one element
          COUNT=$(echo "$ACTUAL" | python3 -c "import sys, json; print(len(json.load(sys.stdin)))")
          echo "Language count: $COUNT"
          if [ "$COUNT" -lt 1 ]; then
            echo "FAIL: expected at least one language"
            exit 1
          fi
          echo "PASS: got $COUNT CodeQL language(s)"
