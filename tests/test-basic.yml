name: Test basic usage - fetch CodeQL languages
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          access-token: ${{ github.token }}
          endpoint: https://api.github.com/repos/${{ github.repository }}/languages

      - name: Assert languages output is set
        env:
          ACTUAL: ${{ steps.action.outputs.languages }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: languages output is empty"
            exit 1
          fi
          echo "PASS: languages output is set to: $ACTUAL"

      - name: Assert languages output is valid JSON array
        env:
          ACTUAL: ${{ steps.action.outputs.languages }}
        run: |
          echo "actual: $ACTUAL"
          # Verify it's a valid JSON array
          echo "$ACTUAL" | python3 -c "import sys, json; data = json.load(sys.stdin); assert isinstance(data, list), 'Expected a list'" || {
            echo "FAIL: languages output is not a valid JSON array"
            exit 1
          }
          echo "PASS: languages output is a valid JSON array"
