name: Test basic usage - get CodeQL languages
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          access-token: ${{ github.token }}
          endpoint: https://api.github.com/repos/${{ github.repository }}/languages

      - name: Assert languages output is a valid JSON array
        env:
          LANGUAGES: ${{ steps.action.outputs.languages }}
        run: |
          echo "languages output: $LANGUAGES"
          # The output must be a valid JSON array (could be empty [] or contain languages)
          if ! echo "$LANGUAGES" | python3 -c "import sys, json; val = json.load(sys.stdin); assert isinstance(val, list)" 2>/dev/null; then
            echo "FAIL: output is not a valid JSON array: $LANGUAGES"
            exit 1
          fi
          echo "PASS: output is a valid JSON array"
