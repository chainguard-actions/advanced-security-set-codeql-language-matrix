name: Test basic usage - languages returned from API
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start mock API server
        run: |
          # Start a simple HTTP server that returns a mock languages response
          python3 -c "
          import http.server
          import json
          import threading

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  body = json.dumps({'Python': 12345, 'JavaScript': 6789}).encode()
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.send_header('Content-Length', len(body))
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, format, *args):
                  pass

          server = http.server.HTTPServer(('0.0.0.0', 18080), Handler)
          t = threading.Thread(target=server.serve_forever)
          t.daemon = True
          t.start()
          import time; time.sleep(3600)
          " &
          sleep 1
          echo "Mock server started"

      - id: action
        uses: .
        with:
          access-token: fake-token
          endpoint: http://172.17.0.1:18080/repos/owner/repo/languages

      - name: Assert languages output is not empty
        env:
          ACTUAL: ${{ steps.action.outputs.languages }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: languages output is empty"
            exit 1
          fi
          echo "PASS: languages output is non-empty"

      - name: Assert python is in languages
        env:
          ACTUAL: ${{ steps.action.outputs.languages }}
        run: |
          echo "actual: $ACTUAL"
          if echo "$ACTUAL" | grep -q '"python"'; then
            echo "PASS: python found in output"
          else
            echo "FAIL: python not found in output: $ACTUAL"
            exit 1
          fi

      - name: Assert javascript is in languages
        env:
          ACTUAL: ${{ steps.action.outputs.languages }}
        run: |
          echo "actual: $ACTUAL"
          if echo "$ACTUAL" | grep -q '"javascript"'; then
            echo "PASS: javascript found in output"
          else
            echo "FAIL: javascript not found in output: $ACTUAL"
            exit 1
          fi
