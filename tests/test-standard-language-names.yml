name: Test standard language names mapping
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          access-token: ${{ github.token }}
          # Use a repo known to have JavaScript/TypeScript so we can verify the mapping
          endpoint: https://api.github.com/repos/actions/checkout/languages
          standard-language-names: "true"
      - name: Assert standard language names are used
        env:
          MATRIX: ${{ steps.action.outputs.matrix }}
          LANGUAGES: ${{ steps.action.outputs.languages }}
        run: |
          echo "matrix: $MATRIX"
          echo "languages: $LANGUAGES"
          if [ -z "$MATRIX" ]; then
            echo "FAIL: matrix output is empty"
            exit 1
          fi
          # Verify matrix is valid JSON with include key
          echo "$MATRIX" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          if 'include' not in data:
              print('FAIL: matrix JSON missing include key')
              sys.exit(1)
          languages = [item.get('language') for item in data['include']]
          print('Languages in matrix:', languages)
          # With standard-language-names=true, javascript/typescript should map to javascript-typescript
          # and java/kotlin should map to java-kotlin
          # Verify that legacy names are NOT present when standard names are enabled
          if 'javascript' in languages and 'javascript-typescript' not in languages:
              print('FAIL: legacy javascript present but javascript-typescript not found')
              sys.exit(1)
          if 'java' in languages and 'java-kotlin' not in languages:
              print('FAIL: legacy java present but java-kotlin not found')
              sys.exit(1)
          print('PASS: standard language names applied correctly')
          "
          echo "PASS: standard-language-names=true works correctly"
