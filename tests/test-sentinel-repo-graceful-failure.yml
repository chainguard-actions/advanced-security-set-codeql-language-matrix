name: Test graceful failure with non-existent repo endpoint
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          access-token: ${{ github.token }}
          # Use the sentinel repo endpoint which will 404 since the repo doesn't exist
          endpoint: https://api.github.com/repos/actionchain-harness/nonexistent-repo/languages
      - name: Assert action ran (succeeded or failed gracefully on non-existent repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          MATRIX: ${{ steps.action.outputs.matrix }}
        run: |
          echo "outcome: $OUTCOME"
          echo "matrix: $MATRIX"
          if [ "$OUTCOME" = "success" ]; then
            # If it somehow succeeded, matrix should be set (possibly empty include list)
            if [ -z "$MATRIX" ]; then
              echo "FAIL: action succeeded but matrix output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with matrix output"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully on non-existent repo endpoint (expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
