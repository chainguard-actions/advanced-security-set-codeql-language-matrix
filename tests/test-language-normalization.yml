name: Test language name normalization
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start mock languages API server
        run: |
          # Return C#, C++, TypeScript, and Kotlin which need to be normalized
          cat > /tmp/mock_server.py << 'EOF'
          import http.server
          import json

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  body = json.dumps({"C#": 5000, "C++": 3000, "TypeScript": 2000, "Kotlin": 1000}).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, format, *args):
                  pass

          server = http.server.HTTPServer(("0.0.0.0", 18082), Handler)
          server.serve_forever()
          EOF
          python3 /tmp/mock_server.py &
          sleep 1
          echo "Mock server started"

      - id: action
        uses: .
        with:
          access-token: fake-token
          endpoint: http://localhost:18082/repos/owner/repo/languages

      - name: Assert languages output is set
        env:
          ACTUAL: ${{ steps.action.outputs.languages }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: languages output is empty"
            exit 1
          fi
          echo "PASS: languages output is set"

      - name: Assert csharp is in output (normalized from C#)
        env:
          ACTUAL: ${{ steps.action.outputs.languages }}
        run: |
          echo "actual: $ACTUAL"
          if echo "$ACTUAL" | grep -qi "csharp"; then
            echo "PASS: csharp found (normalized from C#)"
          else
            echo "FAIL: csharp not found in languages output: $ACTUAL"
            exit 1
          fi

      - name: Assert cpp is in output (normalized from C++)
        env:
          ACTUAL: ${{ steps.action.outputs.languages }}
        run: |
          echo "actual: $ACTUAL"
          if echo "$ACTUAL" | grep -qi "cpp"; then
            echo "PASS: cpp found (normalized from C++)"
          else
            echo "FAIL: cpp not found in languages output: $ACTUAL"
            exit 1
          fi

      - name: Assert javascript is in output (normalized from TypeScript)
        env:
          ACTUAL: ${{ steps.action.outputs.languages }}
        run: |
          echo "actual: $ACTUAL"
          if echo "$ACTUAL" | grep -qi "javascript"; then
            echo "PASS: javascript found (normalized from TypeScript)"
          else
            echo "FAIL: javascript not found in languages output: $ACTUAL"
            exit 1
          fi

      - name: Assert java is in output (normalized from Kotlin)
        env:
          ACTUAL: ${{ steps.action.outputs.languages }}
        run: |
          echo "actual: $ACTUAL"
          if echo "$ACTUAL" | grep -qi "java"; then
            echo "PASS: java found (normalized from Kotlin)"
          else
            echo "FAIL: java not found in languages output: $ACTUAL"
            exit 1
          fi
