name: Test language mapping (TypeScript to javascript, C++ to cpp)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        with:
          access-token: ${{ github.token }}
          # microsoft/vscode is a TypeScript-heavy repo; TypeScript maps to 'javascript' in CodeQL
          endpoint: https://api.github.com/repos/microsoft/vscode/languages
          exclude: ''

      - name: Assert output is a valid JSON array and contains javascript (mapped from TypeScript)
        env:
          ACTUAL: ${{ steps.action.outputs.languages }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: languages output is empty"
            exit 1
          fi
          # Verify it's a valid JSON array
          echo "$ACTUAL" | python3 -c "import sys, json; data = json.load(sys.stdin); assert isinstance(data, list), 'Not a list'" || {
            echo "FAIL: output is not a valid JSON array"
            exit 1
          }
          # Verify 'typescript' is NOT in the output (it should be mapped to 'javascript')
          if echo "$ACTUAL" | python3 -c "import sys, json; langs = json.load(sys.stdin); assert 'typescript' not in langs, 'typescript found unmapped'"; then
            echo "PASS: typescript is correctly mapped (not present as-is)"
          else
            echo "FAIL: typescript should have been mapped to javascript, not kept as typescript"
            exit 1
          fi
          # Verify 'javascript' IS in the output (TypeScript maps to javascript)
          if echo "$ACTUAL" | python3 -c "import sys, json; langs = json.load(sys.stdin); assert 'javascript' in langs, 'javascript not found'"; then
            echo "PASS: javascript is present (mapped from TypeScript)"
          else
            echo "FAIL: expected javascript in output (mapped from TypeScript) but got: $ACTUAL"
            exit 1
          fi
