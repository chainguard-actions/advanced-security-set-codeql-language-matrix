name: Test language name mapping
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Start a mock HTTP server that returns languages needing name mapping
      # C++ -> cpp, C# -> csharp, TypeScript -> javascript (merged), Kotlin -> java (merged)
      - name: Start mock API server
        run: |
          cat > /tmp/mock_server.py << 'EOF'
          import http.server
          import json

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  response = json.dumps({"C++": 5000, "C#": 3000})
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.end_headers()
                  self.wfile.write(response.encode())
              def log_message(self, format, *args):
                  pass

          server = http.server.HTTPServer(("0.0.0.0", 8765), Handler)
          server.serve_forever()
          EOF
          python3 /tmp/mock_server.py &
          echo "Mock server PID: $!"
          sleep 1

      - id: action
        uses: .
        with:
          access-token: fake-token
          endpoint: http://172.17.0.1:8765/repos/owner/repo/languages
          exclude: ""

      - name: Assert cpp is in output (mapped from C++)
        env:
          ACTUAL: ${{ steps.action.outputs.languages }}
        run: |
          echo "actual: $ACTUAL"
          if echo "$ACTUAL" | grep -q "cpp"; then
            echo "PASS: cpp found in output"
          else
            echo "FAIL: expected 'cpp' (mapped from C++) in output, got: $ACTUAL"
            exit 1
          fi

      - name: Assert csharp is in output (mapped from C#)
        env:
          ACTUAL: ${{ steps.action.outputs.languages }}
        run: |
          echo "actual: $ACTUAL"
          if echo "$ACTUAL" | grep -q "csharp"; then
            echo "PASS: csharp found in output"
          else
            echo "FAIL: expected 'csharp' (mapped from C#) in output, got: $ACTUAL"
            exit 1
          fi
