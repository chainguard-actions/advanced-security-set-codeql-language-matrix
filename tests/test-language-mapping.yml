name: Test language name mapping to CodeQL equivalents
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start mock API server
        run: |
          # Return languages that need mapping:
          # C# -> csharp, C++ -> cpp, TypeScript -> javascript, Kotlin -> java, YAML -> actions
          python3 -c "
          import http.server
          import json
          import threading

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  body = json.dumps({
                      'C#': 5000,
                      'C++': 3000,
                      'TypeScript': 2000,
                      'Kotlin': 1000,
                      'YAML': 500
                  }).encode()
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.send_header('Content-Length', len(body))
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, format, *args):
                  pass

          server = http.server.HTTPServer(('0.0.0.0', 18082), Handler)
          t = threading.Thread(target=server.serve_forever)
          t.daemon = True
          t.start()
          import time; time.sleep(3600)
          " &
          sleep 1
          echo "Mock server started"

      - id: action
        uses: .
        with:
          access-token: fake-token
          endpoint: http://172.17.0.1:18082/repos/owner/repo/languages

      - name: Assert languages output is not empty
        env:
          ACTUAL: ${{ steps.action.outputs.languages }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: languages output is empty"
            exit 1
          fi
          echo "PASS: languages output is non-empty"

      - name: Assert csharp is in output (mapped from C#)
        env:
          ACTUAL: ${{ steps.action.outputs.languages }}
        run: |
          echo "actual: $ACTUAL"
          if echo "$ACTUAL" | grep -q '"csharp"'; then
            echo "PASS: csharp found (mapped from C#)"
          else
            echo "FAIL: csharp not found in output: $ACTUAL"
            exit 1
          fi

      - name: Assert cpp is in output (mapped from C++)
        env:
          ACTUAL: ${{ steps.action.outputs.languages }}
        run: |
          echo "actual: $ACTUAL"
          if echo "$ACTUAL" | grep -q '"cpp"'; then
            echo "PASS: cpp found (mapped from C++)"
          else
            echo "FAIL: cpp not found in output: $ACTUAL"
            exit 1
          fi

      - name: Assert javascript is in output (mapped from TypeScript)
        env:
          ACTUAL: ${{ steps.action.outputs.languages }}
        run: |
          echo "actual: $ACTUAL"
          if echo "$ACTUAL" | grep -q '"javascript"'; then
            echo "PASS: javascript found (mapped from TypeScript)"
          else
            echo "FAIL: javascript not found in output: $ACTUAL"
            exit 1
          fi

      - name: Assert java is in output (mapped from Kotlin)
        env:
          ACTUAL: ${{ steps.action.outputs.languages }}
        run: |
          echo "actual: $ACTUAL"
          if echo "$ACTUAL" | grep -q '"java"'; then
            echo "PASS: java found (mapped from Kotlin)"
          else
            echo "FAIL: java not found in output: $ACTUAL"
            exit 1
          fi

      - name: Assert actions is in output (mapped from YAML)
        env:
          ACTUAL: ${{ steps.action.outputs.languages }}
        run: |
          echo "actual: $ACTUAL"
          if echo "$ACTUAL" | grep -q '"actions"'; then
            echo "PASS: actions found (mapped from YAML)"
          else
            echo "FAIL: actions not found in output: $ACTUAL"
            exit 1
          fi
